<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#4752c4"/>
    </linearGradient>
    <linearGradient id="glow" x1="128" y1="0" x2="128" y2="256">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>

  <!-- Gloss effect -->
  <rect width="256" height="256" rx="48" fill="url(#glow)"/>

  <!-- Disc icon -->
  <circle cx="128" cy="128" r="80" stroke="white" stroke-width="6" opacity="0.2"/>
  <circle cx="128" cy="128" r="52" stroke="white" stroke-width="5" opacity="0.4"/>
  <circle cx="128" cy="128" r="24" fill="white" opacity="0.9"/>

  <!-- Musical note -->
  <g transform="translate(128, 108)" fill="none">
    <ellipse cx="-16" cy="28" rx="10" ry="8" fill="#4752c4" opacity="0.9"/>
    <path d="M-6 28L-6 0L20 4L20 0" stroke="#4752c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Decorative rings -->
  <circle cx="128" cy="128" r="110" stroke="white" stroke-width="1.5" opacity="0.08"/>
  <circle cx="128" cy="128" r="120" stroke="white" stroke-width="1" opacity="0.05"/>
</svg>
